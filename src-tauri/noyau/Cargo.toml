[package]
name = "gescom-noyau"
version = "0.2.0"
edition = "2021"
description = "Noyau metier Gescom — calculs purs, persistance, protocole reseau. Sans Tauri."

[lib]
name = "gescom_noyau"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
bcrypt = "0.15"
# Les images de la boutique voyagent en base64 vers les caisses.
base64 = "0.22"
postgres = "0.19.14"

[target.'cfg(windows)'.dependencies]
# Lecture de la trace laissee par l'installateur. Rien d'autre.
winreg = "0.55"
