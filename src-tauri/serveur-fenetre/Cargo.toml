[package]
name = "gescom-serveur-fenetre"
version = "0.2.0"
description = "Gescom Serveur : la fenetre du serveur (D25), une coque qui affiche sa console"
edition = "2021"

# Une coque fine (D25) : aucune base, aucun code metier, pas meme le
# noyau. Elle lit le port du serveur de ce poste, verifie `/sante`, puis
# affiche la console que le serveur sert deja. Si le serveur ne repond
# pas, sa page locale propose de demarrer le service.

[[bin]]
name = "gescom-serveur-fenetre"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
