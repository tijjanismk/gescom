[package]
name = "gescom-serveur"
version = "0.2.0"
edition = "2021"
description = "Service Gescom — heberge la base, les sessions, le canal et les sauvegardes."

[[bin]]
name = "gescom-serveur"
path = "src/main.rs"

[dependencies]
gescom-noyau = { path = "../noyau" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
bcrypt = "0.15"
dirs = "5"

[target.'cfg(windows)'.dependencies]
# Le service Windows parle a l'API Win32 sans crate d'enveloppe
# (service.rs) : Services pour le gestionnaire, Console pour envoyer la
# sortie dans le journal.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Services", "Win32_System_Console"] }
