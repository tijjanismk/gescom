[workspace]
# Trois executables : ce crate (le client, fenetre
# Tauri), `serveur/` (sans fenetre) et `equipe/` (Gescom Equipe, une
# coque qui ne parle qu'au serveur). `noyau/` porte ce qu'ils
# partagent — calculs, schema, protocole.
members = ["noyau", "serveur", "equipe"]

[package]
name = "gescom"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gescom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "5"
tauri-plugin-dialog = "2"
bcrypt = "0.15"
base64 = "0.22"
tauri-plugin-fs = "2.5.1"
gescom-noyau = { path = "noyau" }

[target.'cfg(windows)'.dependencies]
# Uniquement MessageBoxW : le refus de demarrer doit s'afficher AVANT
# que la fenetre Tauri n'existe, donc sans passer par sa boucle
# d'evenements.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_UI_WindowsAndMessaging",
] }
