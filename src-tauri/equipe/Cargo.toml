[package]
name = "gescom-equipe"
version = "0.2.1"
description = "Gescom Equipe : personnel, paie, suivi des clients (PLAN-EQUIPE)"
edition = "2021"

# Une coque fine (D28, D29) : aucune base, aucun code metier. Elle dit a
# la page ou joindre le serveur Gescom, et laisse regler cette adresse
# (D55).

[[bin]]
name = "gescom-equipe"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# D55 : la recherche et l'essai du serveur, la plage de ports et la regle
# de l'adresse d'Equipe — les memes que la caisse (`recherche_serveur`,
# `protocole`). Equipe n'ouvre aucune base du noyau.
gescom-noyau = { path = "../noyau" }
# Les boites « c'est fait » des ecrans partages (mot de passe change).
tauri-plugin-dialog = "2"
# D51 : ouvrir WhatsApp (wa.me) hors de la fenetre ; la permission ne
# laisse ouvrir que ce lien-la (capabilities/default.json).
tauri-plugin-opener = "2"
